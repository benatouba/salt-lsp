[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "salt-lsp"
version = "0.0.1"
description = "Salt Language Server Protocol Server"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [
    {name = "Dan Čermák", email = "dcermak@suse.com"},
    {name = "Cédric Bosdonnat", email = "cbosdonnat@suse.com"},
]
dependencies = [
    "pygls==2.0.1",
    "lsprotocol==2025.0.0",
    "PyYAML==6.0.3",
]

[project.scripts]
salt_lsp_server = "salt_lsp.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pyfakefs==6.3.2",
    "pytest-testinfra==10.2.2",
    "black==24.10.0",
    "mypy==2.4.1",
    "pylint==4.1.3",
    "types-PyYAML==6.0.12.20261103",
]

[tool.hatch.build.targets.wheel]
packages = ["salt_lsp"]

[tool.hatch.build.targets.sdist]
include = ["/salt_lsp", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv --cov=salt_lsp --cov-report term --cov-report html --cov-report xml --cov-branch"
xfail_strict = true

[tool.black]
line-length = 79
target-version = ["py311"]
