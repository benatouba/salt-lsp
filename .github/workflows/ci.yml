name: Python CI

on:
  push:
    branches: [main, integration/salt-modernization]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    name: Python ${{ matrix.python-version }} (source and installed artifact)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Install locked development dependencies (no Salt)
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Regression tests
        run: uv run --locked pytest
      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: uv run --locked black --check salt_lsp tests
      - name: Check types and lint
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked mypy salt_lsp
          uv run --locked pylint --fail-under 9.2 salt_lsp/*.py
      - name: Build sdist and wheel from sdist, install outside checkout
        run: |
          uv build --no-sources --out-dir "$RUNNER_TEMP/artifacts"
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/installed"
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" --constraint "$RUNNER_TEMP/runtime.txt" "$RUNNER_TEMP"/artifacts/*.whl
      - name: Real stdio sessions (module and console entry point)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/installed/bin/python" tests/installed_smoke.py
          "$RUNNER_TEMP/installed/bin/python" tests/installed_smoke.py "$RUNNER_TEMP/installed/bin/salt_lsp_server"
